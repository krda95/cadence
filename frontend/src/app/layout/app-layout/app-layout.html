<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar__logo">
      <a class="sidebar__home" routerLink="/dashboard" aria-label="Cadence, go to dashboard">
        <app-logo />
      </a>
    </div>

    <nav #nav class="sidebar__nav" aria-label="Main">
      <span class="sidebar__pill" aria-hidden="true"></span>
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        class="sidebar__link"
      >
        <svg lucideLayoutDashboard aria-hidden="true"></svg>
        <span>Dashboard</span>
      </a>
      <a
        routerLink="/today"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        class="sidebar__link"
      >
        <svg lucideCalendarDays aria-hidden="true"></svg>
        <span>Today</span>
      </a>
      <a
        routerLink="/history"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        class="sidebar__link"
      >
        <svg lucideHistory aria-hidden="true"></svg>
        <span>History</span>
      </a>
      <a
        routerLink="/goals"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        class="sidebar__link"
      >
        <svg lucideTarget aria-hidden="true"></svg>
        <span>Goals</span>
      </a>
      <a
        routerLink="/settings"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        class="sidebar__link"
      >
        <svg lucideSettings aria-hidden="true"></svg>
        <span>Settings</span>
      </a>
    </nav>

    <div class="sidebar__bottom">
      <div class="user-menu" #userMenu>
        @if (isUserMenuOpen()) {
          <div
            class="user-menu__popover"
            id="user-menu"
            role="menu"
            animate.enter="user-menu__popover--in"
            animate.leave="user-menu__popover--out"
          >
            <button type="button" class="user-menu__logout" role="menuitem" (click)="logout()">
              <svg lucideLogOut aria-hidden="true"></svg>
              <span>Logout</span>
            </button>
          </div>
        }

        <button
          #userTrigger
          type="button"
          class="user-card"
          aria-haspopup="menu"
          aria-controls="user-menu"
          [attr.aria-expanded]="isUserMenuOpen()"
          (click)="toggleUserMenu()"
        >
          <!-- <div class="user-avatar" aria-hidden="true">
            {{ currentUser()?.profileInitial }}
          </div> -->
          <div class="user-avatar" aria-hidden="true">
            @if (currentUser()?.avatar_url; as avatarUrl) {
              <img class="user-avatar__image" [src]="avatarUrl" alt="" />
            } @else {
              {{ currentUser()?.profileInitial }}
            }
          </div>

          <div class="user-card__details">
            <div class="user-name">{{ currentUser()?.display_name }}</div>
            <div class="user-email">{{ currentUser()?.email }}</div>
          </div>

          <svg
            lucideChevronUp
            class="user-card__chevron"
            [class.user-card__chevron--open]="isUserMenuOpen()"
            aria-hidden="true"
          ></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="content">
    <div class="page-container">
      <router-outlet />
    </div>
    @if (!isAssistantOpen()) {
      <button
        type="button"
        class="assistant-trigger"
        aria-label="Open AI Assistant"
        (click)="toggleAssistant()"
      >
        <svg lucideBot aria-hidden="true"></svg>
      </button>
    }

    @if (isAssistantOpen()) {
      <app-assistant-panel
        animate.enter="assistant-enter"
        animate.leave="assistant-leave"
        (closeAssistant)="closeAssistant()"
      />
    }
  </main>
</div>
