<form class="change-password" [formGroup]="form" (ngSubmit)="submit()">
  <app-input
    formControlName="currentPassword"
    label="Current password"
    type="password"
    autocomplete="current-password"
    placeholder="••••••••"
  />

  <app-input
    formControlName="password"
    label="New password"
    type="password"
    autocomplete="new-password"
    placeholder="••••••••"
  />
  <p class="change-password__hint">At least {{ minPasswordLength }} characters.</p>

  <app-input
    formControlName="confirmPassword"
    label="Confirm new password"
    type="password"
    autocomplete="new-password"
    placeholder="••••••••"
  />

  @if (errorMessage(); as message) {
    <p class="banner banner--error" role="alert">{{ message }}</p>
  }

  @if (successMessage(); as message) {
    <p class="banner banner--success" role="status">{{ message }}</p>
  }

  <app-button type="submit" [loading]="isSubmitting()" [disabled]="form.invalid">
    {{ isSubmitting() ? 'Changing password…' : 'Change password' }}
  </app-button>
</form>
