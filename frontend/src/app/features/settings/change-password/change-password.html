<div class="change-password" [class.change-password--open]="isOpen()">
  <button
    type="button"
    class="change-password__toggle"
    aria-controls="change-password-panel"
    [attr.aria-expanded]="isOpen()"
    (click)="toggle()"
  >
    <span class="change-password__summary">
      <span class="change-password__title">Password</span>
      <span class="change-password__description">Change your password.</span>
    </span>

    <svg class="change-password__chevron" lucideChevronDown aria-hidden="true"></svg>
  </button>

  @if (successMessage(); as message) {
    <p class="banner banner--success change-password__success" role="status">{{ message }}</p>
  }

  <!-- The collapsed panel stays in the DOM so it can animate; `inert` keeps it out of tab order. -->
  <div
    id="change-password-panel"
    class="change-password__panel"
    [attr.inert]="isOpen() ? null : ''"
    [attr.aria-hidden]="!isOpen()"
  >
    <div class="change-password__panel-inner">
      <form class="change-password__form" [formGroup]="form" (ngSubmit)="submit()">
        <app-input
          formControlName="currentPassword"
          label="Current password"
          type="password"
          autocomplete="current-password"
        />

        <app-input
          formControlName="password"
          label="New password"
          type="password"
          autocomplete="new-password"
          [hint]="'At least ' + minPasswordLength + ' characters.'"
        />

        <app-input
          formControlName="confirmPassword"
          label="Confirm new password"
          type="password"
          autocomplete="new-password"
        />

        @if (errorMessage(); as message) {
          <p class="banner banner--error" role="alert">{{ message }}</p>
        }

        <div class="change-password__actions">
          <app-button variant="secondary" [disabled]="isSubmitting()" (click)="close()">
            Cancel
          </app-button>

          <app-button type="submit" [loading]="isSubmitting()" [disabled]="form.invalid">
            {{ isSubmitting() ? 'Changing password…' : 'Change password' }}
          </app-button>
        </div>
      </form>
    </div>
  </div>
</div>
