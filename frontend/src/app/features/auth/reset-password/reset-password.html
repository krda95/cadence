<div class="reset-password">
  <a class="back-link" routerLink="/login">
    <svg lucideArrowLeft></svg>
    Back to sign in
  </a>
  @if (!linkInvalid) {
    <h1>Reset link expired</h1>
    <p class="subtitle">This password reset link is invalid or has expired.</p>

    <app-button [type]="'button'" [variant]="'primary'" (click)="navigateToForgotPassword()">
      Request new reset link
    </app-button>
  } @else {
    <h1>Create new password</h1>
    <p class="subtitle">Enter a new password for your Cadence account.</p>

    <form [formGroup]="resetPasswordForm" (ngSubmit)="submit()">
      <app-input
        formControlName="password"
        label="New password"
        type="password"
        placeholder="••••••••"
        [tabIndex]="1"
      />

      <app-input
        formControlName="confirmPassword"
        label="Confirm new password"
        type="password"
        placeholder="••••••••"
        [tabIndex]="2"
      />

      <app-button
        [type]="'submit'"
        style="margin-top: 10px"
        [disabled]="resetPasswordForm.invalid || isSubmitting"
        [tabIndex]="3"
      >
        @if (isSubmitting) {
          <span class="spinner" aria-hidden="true"></span>
          <span>Updating password...</span>
        } @else {
          Update password
        }
      </app-button>
    </form>
  }
</div>
