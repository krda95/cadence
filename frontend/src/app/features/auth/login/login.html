<div class="login">
  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to pick up where you left off.</p>

  <form [formGroup]="loginForm" (ngSubmit)="login()">
    @if (justRegistered()) {
      <p class="banner banner--success" role="status">Account created. Sign in to continue.</p>
    }

    <app-input
      formControlName="email"
      label="Email"
      type="email"
      autocomplete="username"
      [autoFocus]="true"
      placeholder="you@email.com"
    />

    <app-input
      formControlName="password"
      label="Password"
      type="password"
      autocomplete="current-password"
      placeholder="••••••••"
    />

    <a class="link" routerLink="/forgot-password">Forgot password?</a>

    @if (errorMessage(); as message) {
      <p class="banner banner--error" role="alert">{{ message }}</p>
    }

    <app-button
      type="submit"
      variant="primary"
      [loading]="isSubmitting()"
      [disabled]="loginForm.invalid"
    >
      {{ isSubmitting() ? 'Signing in…' : 'Sign in' }}
    </app-button>
  </form>

  <p class="footer">
    New to Cadence?
    <a routerLink="/register">Sign up</a>
  </p>
  <div class="login__about">
    <a routerLink="/about">
      Behind Cadence
      <span aria-hidden="true">↗</span>
    </a>
  </div>
</div>
