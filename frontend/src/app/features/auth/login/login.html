<div class="login">
  <h1>Welcome back</h1>
  <p>
    Sign in to pick up where you left off.
  </p>

  <form [formGroup]="loginForm" (ngSubmit)="login()">
    <app-input
      formControlName="email"
      label="Email"
      type="email"
      [autoFocus]=true
      [tabIndex]="1"
      placeholder="you@email.com"/>

    <app-input
      formControlName="password"
      label="Password"
      type="password"
      [tabIndex]="2"
      placeholder="••••••••">
      <a
        input-action
        class="forgot-link"
        routerLink="/forgot-password"
        [tabIndex]="5"
        >
        Forgot?
      </a>
    </app-input>

    <app-button
      [type]="'submit'"
      [disabled]="loginForm.invalid"
      [variant]="'primary'"
      [tabIndex]="4">
      Sign in
    </app-button>
  </form>
  <p class="footer">
    New to Cadence?
    <a routerLink="/register">Sign up</a>
  </p>
</div>
