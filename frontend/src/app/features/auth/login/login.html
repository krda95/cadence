<div class="login">
  <h1>Welcome back</h1>
  <p>
    Sign in to pick up where you left off.
  </p>

  <form [formGroup]="loginForm">
    <app-input
      formControlName="email"
      label="Email"
      type="email"
      placeholder="you@email.com"/>

    <app-input
      formControlName="password"
      label="Password"
      type="password"
      placeholder="••••••••">
      <a
        input-action
        class="forgot-link"
        routerLink="/forgot-password">
        Forgot?
      </a>
    </app-input>

    <app-button
      [type]="'submit'"
      [disabled]="loginForm.invalid"
      [variant]="'primary'">
      Sign in
    </app-button>
  </form>
</div>
