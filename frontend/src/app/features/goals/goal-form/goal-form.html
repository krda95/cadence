<app-modal
  [title]="isEditMode ? 'Edit goal' : 'Add goal'"
  size="lg"
  [open]="true"
  [guarded]="true"
  (closeRequested)="requestClose()"
>
  @if (isLoading()) {
    <app-loader></app-loader>
  } @else if (loadError()) {
    <div class="goal-modal__error" role="alert">
      <p>Couldn't load this goal.</p>
      <app-button type="button" variant="secondary" (click)="close()">Close</app-button>
    </div>
  } @else {
    <form
      class="goal-form"
      [formGroup]="form"
      [style.--goal-color]="form.controls.color.value"
      (ngSubmit)="submit()"
    >
      <app-input
        id="goal-name"
        label="Goal name"
        [variant]="'filled'"
        [autoFocus]="true"
        [autoSelect]="true"
        showErrorsOn="dirty"
        placeholder="e.g. Learn a new language"
        formControlName="name"
      />

      <div class="goal-form__row">
        <div class="goal-form__field">
          <label for="goal-color">Color</label>
          <div class="goal-form__color">
            <input id="goal-color" type="color" formControlName="color" />
          </div>
        </div>

        <div class="goal-form__field">
          <label id="goal-icon-label">Icon</label>
          <app-icon-picker
            [value]="form.controls.icon.value"
            [color]="form.controls.color.value"
            [style.--goal-color]="form.controls.color.value"
            (valueChange)="setIcon($event)"
          />
        </div>
      </div>

      <div class="goal-form__field">
        <div class="goal-form__target">
          <div class="goal-form__control">
            <label id="goal-target-type-label">Target type</label>
            <app-select
              label="Target type"
              [options]="targetTypeOptions"
              formControlName="target_type"
            />
          </div>

          <app-input
            id="goal-value"
            label="Value"
            [min]="0"
            [variant]="'filled'"
            [step]="1"
            showErrorsOn="dirty"
            placeholder="e.g. 2,000"
            formControlName="target_value"
          />

          <app-combobox
            label="Unit"
            placeholder="Select or type"
            [options]="unitOptions"
            formControlName="unit"
          />
        </div>
      </div>

      <div class="goal-form__field" role="radiogroup" aria-labelledby="goal-period-label">
        <label id="goal-period-label">Logging period</label>
        <div class="goal-form__chips">
          <label class="goal-form__chip">
            <input type="radio" formControlName="period" value="daily" />
            <span>Daily</span>
          </label>
          <label class="goal-form__chip">
            <input type="radio" formControlName="period" value="weekly" />
            <span>Weekly</span>
          </label>
        </div>
      </div>

      @if (isInactive()) {
        <div class="goal-form__field" role="radiogroup" aria-labelledby="goal-state-label">
          <label id="goal-state-label">State</label>
          <div class="goal-form__chips">
            <label class="goal-form__chip">
              <input type="radio" formControlName="is_active" [value]="true" />
              <span>Active</span>
            </label>

            <label class="goal-form__chip">
              <input type="radio" formControlName="is_active" [value]="false" />
              <span>Inactive</span>
            </label>
          </div>
        </div>
      }

      @if (submitError(); as message) {
        <p class="goal-form__error" role="alert">{{ message }}</p>
      }

      <div class="goal-form__actions">
        @if (isEditMode && !isInactive()) {
          <app-button
            class="goal-form__deactivate"
            type="button"
            variant="danger"
            [disabled]="isSaving()"
            (click)="deactivate()"
          >
            Deactivate
          </app-button>
        }

        <div class="goal-form__primary-actions">
          <app-button
            type="button"
            variant="secondary"
            [disabled]="isSaving()"
            (click)="requestClose()"
          >
            Discard
          </app-button>

          <app-button type="submit" variant="primary" [disabled]="isSaving() || form.invalid">
            {{ isSaving() ? 'Saving…' : isEditMode ? 'Save changes' : 'Add goal' }}
          </app-button>
        </div>
      </div>
    </form>
  }
</app-modal>
