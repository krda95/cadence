<div class="input">

    <div class="header">
        @if(label()) {
          <label>{{ label() }}</label>
        }
        <ng-content select="[input-action]" />
    </div>

    <div class="control" [class.invalid]="hasError()">
        <input
            [type]="inputType()"
            [placeholder]="placeholder()"
            [value]="value()"
            (input)="handleInput($event)"
            (blur)="handleBlur()">

        @if(type() === 'password') {
            <button
            type="button"
            aria-label="Toggle password visibility"
            [disabled]="disabled()"
            (click)="togglePassword()">
            @if (passwordVisible()) {
                <svg lucideEye></svg>
            } @else {
                <svg lucideEyeClosed></svg>
            }
            </button>
        }
    </div>
    @if (errorMessage(); as message) {
        <span
            class="error-message"
            role="alert">
            {{ message }}
        </span>
    }
</div>
